<div class="container mt-5">
  <p class="text-center p-3 fs-3 fw-bold">Productos en el Carrito</p>

  <ng-container *ngIf="products$ | async as products; else loading">
    <div
      *ngIf="products.length > 0"
      class="container d-flex justify-content-center"
    >
      <div class="row w-50">
        <div
          *ngFor="let product of products$ | async"
          class="col-12 col-md-6 col-lg-4 mb-4 w-100"
        >
          <div
            class="border rounded p-3 shadow-sm d-flex justify-content-between align-items-center"
          >
            <div
              class="d-flex flex-column ms-5 w-25 justify-content-center align-items-center"
            >
              <img
                src="assets/images/{{ product?.image }}"
                alt="Imagen del producto"
              />
              <p class="card-title">{{ product.product }}</p>
            </div>

            <p class="mt-3 fst-italic">{{ product.price }}.00 €</p>

            <button
              (click)="removeProduct(product)"
              class="btn btn-danger me-5"
            >
              Eliminar
            </button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-template #loading>
    <p>No hay productos en el carrito.</p>
  </ng-template>
</div>
