<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <ng-container *ngIf="products$.length > 0; else loading">
      <div *ngIf="products$.length > 0" class="container">
        <div class="row">
          <div class="col-3 d-flex flex-column p-4 border-end">
            <app-menu-lateral
              [products_list]="products$"
              (buttonChangeMainProduct)="changeMainProduct($event)"
            ></app-menu-lateral>
          </div>

          <div
            [ngClass]="{
              'favourite-div': mainProduct$?.favourite === true,
              'add-div': mainProduct$?.add === true
            }"
            class="col-9 p-4"
          >
            <app-main-product
              [main_product]="mainProduct$"
              *ngIf="mainProduct$ != null"
              (buttonDeleteProduct)="deleteMainProduct(mainProduct$)"
              (buttonAddProduct)="addMainProduct($event)"
            ></app-main-product>

            <app-similar-products
              [main_product]="mainProduct$"
              (buttonOpenModal)="openModal($event)"
            ></app-similar-products>

            <app-modal
              [modal_product]="modalProduct"
              [is_ModalOpen]="isModalOpen"
              (buttonCloseModal)="closeModal()"
            ></app-modal>

            <app-opiniones [main_product]="mainProduct$"></app-opiniones>
          </div>
        </div>
      </div>
    </ng-container>

    <ng-template #loading>
      <div class="text-center p-5">
        <p class="fs-4">Loading...</p>
      </div>
    </ng-template>
  </body>
</html>
