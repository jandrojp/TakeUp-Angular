<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=favorite"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <div id="nav" class="container border-bottom p-2">
    <div class="row d-flex align-items-center justify-content-center">
      <div class="container col-6 d-flex">
        <img
          src="assets/images/coffee-logo.png"
          class="img-fluid ms-4"
          alt="Logo"
        />
      </div>
      <div
        class="container col-6 d-flex align-items-center justify-content-around"
      >
        <a routerLink="/" routerLinkActive="active">Inicio</a>
        <a routerLink="/nosotros" routerLinkActive="active">Nosotros</a>
        <a routerLink="/tienda" routerLinkActive="active">Tienda</a>
        <a (click)="irATienda()" style="cursor: pointer">Ayuda</a>

        <button
          id="bcarrito"
          routerLink="/carrito"
          routerLinkActive="active"
          class="btn text-white d-flex justify-content-center align-items-center p-2"
        >
          Carrito
          <span class="material-symbols-outlined ms-2"> shopping_cart </span>
        </button>
        <a routerLink="/ventas/formularioAñadir" routerLinkActive="active"
          ><span id="add" class="material-symbols-outlined">
            add_circle
          </span></a
        >
      </div>
    </div>
  </div>
</html>
